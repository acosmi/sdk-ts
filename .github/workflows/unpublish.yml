name: Unpublish (one-shot)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish (e.g. 1.11.0)'
        required: true
        type: string

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Unpublish
        run: npm unpublish "@acosmi/sdk-ts@${{ inputs.version }}" --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
