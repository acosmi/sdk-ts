name: Release

on:
  push:
    tags:
      - 'v*'
  # 2026-08-02: tag push 不是可靠的唯一入口。v2.14.0 发版时实测——tag 建得好好的、
  # workflow active、Actions 权限正常、同仓 push-to-main 触发的 CodeQL 几分钟前刚跑
  # 成功——但连续 5 次 tag 创建(REST 建 ref / 浅仓 git push / 完整 clone git push)
  # 全部没有产生任何 run，仓库事件流里连 CreateEvent 都没有(而三次 tag 删除的
  # DeleteEvent 都在)。同一机制 9 小时前发 v2.13.0 时还是好的，未能定位到成因。
  #
  # 所以补一条不依赖 ref 事件的入口：`gh workflow run release.yml --ref vX.Y.Z`。
  # 语义与 tag push 完全一致 —— checkout 取 `github.ref`(即那个 tag)，npm publish
  # 发该 ref 上 package.json 的版本，action-gh-release 也按 `github.ref` 建 Release。
  # 注意：dispatch 用的是**被指定 ref 上**的 workflow 文件，所以要发的那个 tag
  # 必须已经包含本段。
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # JS-based actions pinned to majors that natively run on Node 24
    # (checkout@v6 / setup-node@v6 / action-gh-release@v3 — all declare
    # `using: node24`), so no Node-20 deprecation annotation and no need for
    # the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # SDK ships engines.node >= 18 (consumer compat unchanged). CI itself
          # runs on Node 24 to align with the JS-action runtime above.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`): rolldown (via tsup) ships a wasm32-wasi
        # fallback binding that pins `@emnapi/core`/`@emnapi/runtime`, but npm
        # never records those package entries in the lock (the wasm binding is
        # never the selected platform), so strict `npm ci` aborts with
        # "Missing @emnapi/* from lock file". `npm install` resolves per-platform.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate API docs
        run: npm run docs

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
