name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # JS-based actions pinned to majors that natively run on Node 24
    # (checkout@v6 / setup-node@v6 / action-gh-release@v3 — all declare
    # `using: node24`), so no Node-20 deprecation annotation and no need for
    # the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # SDK ships engines.node >= 18 (consumer compat unchanged). CI itself
          # runs on Node 24 to align with the JS-action runtime above.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate API docs
        run: npm run docs

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
