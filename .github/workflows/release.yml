name: Release

on:
  push:
    tags:
      - 'v*'
  # 2026-08-02: 发版入口用 workflow_dispatch，不要依赖 tag push。
  #
  # v2.14.0 发版时连续 5 次创建 tag 都没有产生任何 run。根因(已用对照实验查清)：
  # GitHub 扫描 commit message **全文**(不只标题行)寻找 skip 指令字面量，命中即
  # 静默跳过该次 push —— tag push 也是 push 事件，跳过时不报错、不留 run。而
  # subtree split 原样保留 monorepo 的 commit message，monorepo 为省 CI 额度常带
  # 该指令，标记就这么被带进公开仓落在待发版的 commit 上。后两次尝试的 commit
  # 标题行是干净的，但正文为了"记录这个现象"引用了该字面量 —— 否认它的那句话
  # 本身包含了它。
  #
  # 对照实验(同一分钟、同一 git push、唯一变量是被 tag 的 commit)：
  #   message 干净的 commit      → 2 秒内产生 run
  #   仅正文含该字面量的 commit  → 零 run
  #
  # 所以 tag push 并没有坏，`on: push: tags` 保留。仍以 dispatch 为推荐入口，是
  # 因为它不是 push 事件、对这一整类失败结构性免疫：
  #   gh workflow run release.yml --ref vX.Y.Z
  # 语义与 tag push 一致 —— checkout 取 `github.ref`(那个 tag)，npm publish 发该
  # ref 上 package.json 的版本，action-gh-release 也按 `github.ref` 建 Release。
  # 注意：dispatch 用的是**被指定 ref 上**的 workflow 文件，所以要发的那个 tag
  # 必须已经包含本段。
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # JS-based actions pinned to majors that natively run on Node 24
    # (checkout@v6 / setup-node@v6 / action-gh-release@v3 — all declare
    # `using: node24`), so no Node-20 deprecation annotation and no need for
    # the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # SDK ships engines.node >= 18 (consumer compat unchanged). CI itself
          # runs on Node 24 to align with the JS-action runtime above.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`): rolldown (via tsup) ships a wasm32-wasi
        # fallback binding that pins `@emnapi/core`/`@emnapi/runtime`, but npm
        # never records those package entries in the lock (the wasm binding is
        # never the selected platform), so strict `npm ci` aborts with
        # "Missing @emnapi/* from lock file". `npm install` resolves per-platform.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate API docs
        run: npm run docs

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
